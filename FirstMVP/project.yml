name: FirstMVP
options:
  bundleIdPrefix: com.mohamedmorad
targets:
  FirstMVP:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSCameraUsageDescription: "FirstMVP analyses waste items live on this device to suggest the correct bin."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FirstMVP can classify a waste item from a photo you select."
        INFOPLIST_KEY_UILaunchScreen_Generation: true

  FirstMVPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: FirstMVP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  FirstMVP:
    build:
      targets:
        FirstMVP: all
        FirstMVPTests: [test]
    test:
      targets:
        - FirstMVPTests
